openapi: 3.1.0
info:
  title: CHOVIA API
  description: Official Food Delivery Platform REST API Documentation
  version: 1.0.0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide JWT Access Token obtained from /api/v1/auth/login
  schemas:
    ErrorResponse:
      type: object
      required:
        - statusCode
        - code
        - message
        - timestamp
      properties:
        statusCode:
          type: integer
          example: 400
        code:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: Invalid request payload
        details:
          type:
            - object
            - "null"
        timestamp:
          type: string
          format: date-time
    ValidationError:
      type: object
      required:
        - statusCode
        - code
        - message
        - details
        - timestamp
      properties:
        statusCode:
          type: integer
          example: 400
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Request validation failed
        details:
          type: array
          items:
            type: object
            required:
              - path
              - message
            properties:
              path:
                type: string
                example: email
              message:
                type: string
                example: Invalid email address
        timestamp:
          type: string
          format: date-time
    PaginationMeta:
      type: object
      required:
        - total
        - page
        - limit
        - totalPages
      properties:
        total:
          type: integer
          example: 42
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        totalPages:
          type: integer
          example: 5
    HealthStatusResponse:
      type: object
      required:
        - status
        - database
        - redis
        - environment
        - timestamp
      properties:
        status:
          type: string
          example: ok
        database:
          type: string
          example: connected
        redis:
          type: string
          example: connected
        environment:
          type: string
          example: development
        timestamp:
          type: string
          format: date-time
paths:
  /health/live:
    get:
      tags:
        - Health
      description: Application Liveness Probe (checks process uptime)
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  uptime:
                    type: number
                  timestamp:
                    type: string
                required:
                  - status
                  - uptime
                  - timestamp
                additionalProperties: false
  /health/ready:
    get:
      tags:
        - Health
      description: Application Readiness Probe (verifies PostgreSQL and Redis)
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  database:
                    type: string
                  redis:
                    type: string
                  environment:
                    type: string
                  timestamp:
                    type: string
                required:
                  - status
                  - database
                  - redis
                  - environment
                  - timestamp
                additionalProperties: false
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  database:
                    type: string
                  redis:
                    type: string
                  environment:
                    type: string
                  timestamp:
                    type: string
                required:
                  - status
                  - database
                  - redis
                  - environment
                  - timestamp
                additionalProperties: false
  /health:
    get:
      tags:
        - Health
      description: API Health & Infrastructure Connectivity Status Check
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  database:
                    type: string
                  redis:
                    type: string
                  environment:
                    type: string
                  timestamp:
                    type: string
                required:
                  - status
                  - database
                  - redis
                  - environment
                  - timestamp
                additionalProperties: false
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      description: Register a new customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 255
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  type: string
                  minLength: 8
                  maxLength: 100
                  pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).*$
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 100
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 100
                phone:
                  type: string
                  pattern: ^\+?[1-9]\d{7,14}$
              required:
                - email
                - password
                - firstName
                - lastName
                - phone
              additionalProperties: false
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      email:
                        type: string
                        format: email
                        pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                      role:
                        type: string
                        enum:
                          - CUSTOMER
                          - RESTAURANT_STAFF
                          - RIDER
                          - ADMIN
                      status:
                        type: string
                        enum:
                          - ACTIVE
                          - SUSPENDED
                          - DEACTIVATED
                      emailVerified:
                        type: boolean
                      phoneVerified:
                        type: boolean
                      firstName:
                        type:
                          - string
                          - "null"
                      lastName:
                        type:
                          - string
                          - "null"
                      phone:
                        type:
                          - string
                          - "null"
                      createdAt:
                        type: string
                    required:
                      - id
                      - email
                      - role
                      - status
                      - emailVerified
                      - phoneVerified
                      - createdAt
                    additionalProperties: false
                  otpData:
                    type: object
                    properties:
                      message:
                        type: string
                      signedToken:
                        type: string
                      expiresInMinutes:
                        type: number
                    required:
                      - message
                      - signedToken
                      - expiresInMinutes
                    additionalProperties: false
                required:
                  - user
                  - otpData
                additionalProperties: false
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      description: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                password:
                  type: string
                  minLength: 1
                deviceInfo:
                  type: object
                  properties:
                    deviceId:
                      type: string
                    deviceName:
                      type: string
                    deviceType:
                      default: WEB
                      type: string
                      enum:
                        - IOS
                        - ANDROID
                        - WEB
                    pushToken:
                      type: string
              required:
                - email
                - password
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      email:
                        type: string
                        format: email
                        pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                      role:
                        type: string
                        enum:
                          - CUSTOMER
                          - RESTAURANT_STAFF
                          - RIDER
                          - ADMIN
                      status:
                        type: string
                        enum:
                          - ACTIVE
                          - SUSPENDED
                          - DEACTIVATED
                      emailVerified:
                        type: boolean
                      phoneVerified:
                        type: boolean
                      firstName:
                        type:
                          - string
                          - "null"
                      lastName:
                        type:
                          - string
                          - "null"
                      phone:
                        type:
                          - string
                          - "null"
                      createdAt:
                        type: string
                    required:
                      - id
                      - email
                      - role
                      - status
                      - emailVerified
                      - phoneVerified
                      - createdAt
                    additionalProperties: false
                required:
                  - accessToken
                  - refreshToken
                  - user
                additionalProperties: false
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      description: Rotate and obtain new access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 1
              required:
                - refreshToken
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      email:
                        type: string
                        format: email
                        pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                      role:
                        type: string
                        enum:
                          - CUSTOMER
                          - RESTAURANT_STAFF
                          - RIDER
                          - ADMIN
                      status:
                        type: string
                        enum:
                          - ACTIVE
                          - SUSPENDED
                          - DEACTIVATED
                      emailVerified:
                        type: boolean
                      phoneVerified:
                        type: boolean
                      firstName:
                        type:
                          - string
                          - "null"
                      lastName:
                        type:
                          - string
                          - "null"
                      phone:
                        type:
                          - string
                          - "null"
                      createdAt:
                        type: string
                    required:
                      - id
                      - email
                      - role
                      - status
                      - emailVerified
                      - phoneVerified
                      - createdAt
                    additionalProperties: false
                required:
                  - accessToken
                  - refreshToken
                  - user
                additionalProperties: false
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      description: Log out and revoke refresh token session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 1
              required:
                - refreshToken
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  success:
                    default: true
                    type: boolean
                required:
                  - message
                  - success
                additionalProperties: false
  /api/v1/auth/verify-email/request:
    post:
      tags:
        - Auth
      description: Request an email verification OTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              required:
                - email
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  signedToken:
                    type: string
                  expiresInMinutes:
                    type: number
                required:
                  - message
                  - signedToken
                  - expiresInMinutes
                additionalProperties: false
  /api/v1/auth/verify-email/verify:
    post:
      tags:
        - Auth
      description: Verify email with 6-digit OTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                otp:
                  type: string
                  pattern: ^\d{6}$
                signedToken:
                  type: string
                  minLength: 1
              required:
                - email
                - otp
                - signedToken
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  success:
                    default: true
                    type: boolean
                required:
                  - message
                  - success
                additionalProperties: false
  /api/v1/auth/password-reset/request:
    post:
      tags:
        - Auth
      description: Request a password reset OTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              required:
                - email
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  signedToken:
                    type: string
                  expiresInMinutes:
                    type: number
                required:
                  - message
                  - signedToken
                  - expiresInMinutes
                additionalProperties: false
  /api/v1/auth/password-reset/verify:
    post:
      tags:
        - Auth
      description: Verify password reset OTP and obtain reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                otp:
                  type: string
                  pattern: ^\d{6}$
                signedToken:
                  type: string
                  minLength: 1
              required:
                - email
                - otp
                - signedToken
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  resetToken:
                    type: string
                  success:
                    type: boolean
                required:
                  - message
                  - resetToken
                  - success
                additionalProperties: false
  /api/v1/auth/password-reset/complete:
    post:
      tags:
        - Auth
      description: Complete password reset using reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                resetToken:
                  type: string
                  minLength: 1
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 100
                  pattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).*$
              required:
                - email
                - resetToken
                - newPassword
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  success:
                    default: true
                    type: boolean
                required:
                  - message
                  - success
                additionalProperties: false
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      description: Get currently authenticated user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  email:
                    type: string
                    format: email
                    pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                  role:
                    type: string
                    enum:
                      - CUSTOMER
                      - RESTAURANT_STAFF
                      - RIDER
                      - ADMIN
                  status:
                    type: string
                    enum:
                      - ACTIVE
                      - SUSPENDED
                      - DEACTIVATED
                  emailVerified:
                    type: boolean
                  phoneVerified:
                    type: boolean
                  firstName:
                    type:
                      - string
                      - "null"
                  lastName:
                    type:
                      - string
                      - "null"
                  phone:
                    type:
                      - string
                      - "null"
                  createdAt:
                    type: string
                required:
                  - id
                  - email
                  - role
                  - status
                  - emailVerified
                  - phoneVerified
                  - createdAt
                additionalProperties: false
  /api/v1/users/profile:
    get:
      tags:
        - Users
      description: Get authenticated user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  email:
                    type: string
                    format: email
                    pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                  role:
                    type: string
                    enum:
                      - CUSTOMER
                      - RESTAURANT_STAFF
                      - RIDER
                      - ADMIN
                  status:
                    type: string
                    enum:
                      - ACTIVE
                      - SUSPENDED
                      - DEACTIVATED
                  emailVerified:
                    type: boolean
                  phoneVerified:
                    type: boolean
                  firstName:
                    type:
                      - string
                      - "null"
                  lastName:
                    type:
                      - string
                      - "null"
                  phone:
                    type:
                      - string
                      - "null"
                  createdAt:
                    type: string
                required:
                  - id
                  - email
                  - role
                  - status
                  - emailVerified
                  - phoneVerified
                  - createdAt
                additionalProperties: false
    patch:
      tags:
        - Users
      description: Update authenticated user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 100
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 100
                phone:
                  type: string
                  pattern: ^\+?[1-9]\d{7,14}$
                image:
                  type: string
                  format: uri
              additionalProperties: false
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  email:
                    type: string
                    format: email
                    pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                  role:
                    type: string
                    enum:
                      - CUSTOMER
                      - RESTAURANT_STAFF
                      - RIDER
                      - ADMIN
                  status:
                    type: string
                    enum:
                      - ACTIVE
                      - SUSPENDED
                      - DEACTIVATED
                  emailVerified:
                    type: boolean
                  phoneVerified:
                    type: boolean
                  firstName:
                    type:
                      - string
                      - "null"
                  lastName:
                    type:
                      - string
                      - "null"
                  phone:
                    type:
                      - string
                      - "null"
                  createdAt:
                    type: string
                required:
                  - id
                  - email
                  - role
                  - status
                  - emailVerified
                  - phoneVerified
                  - createdAt
                additionalProperties: false
  /api/v1/users/devices:
    get:
      tags:
        - Users
      description: List registered devices for authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    expoPushToken:
                      type: string
                    deviceName:
                      type:
                        - string
                        - "null"
                    platform:
                      type:
                        - string
                        - "null"
                    isActive:
                      type: boolean
                    lastSeenAt:
                      type:
                        - string
                        - "null"
                    createdAt:
                      type: string
                  required:
                    - id
                    - expoPushToken
                    - isActive
                    - createdAt
                  additionalProperties: false
    post:
      tags:
        - Users
      description: Register or update user device push token
