  /api/v1/pricing/estimate:
    post:
      tags:
        - Pricing
      description: Calculate authoritative order estimate including distance delivery
        and platform fees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                restaurantId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                addressId:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
                items:
                  minItems: 1
                  type: array
                  items:
                    type: object
                    properties:
                      menuItemId:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      quantity:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 50
                    required:
                      - menuItemId
                      - quantity
              required:
                - restaurantId
                - items
              additionalProperties: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  subtotalMinor:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  subtotalFormatted:
                    type: string
                  deliveryFeeMinor:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  deliveryFeeFormatted:
                    type: string
                  platformFeeMinor:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  platformFeeFormatted:
                    type: string
                  totalMinor:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  totalFormatted:
                    type: string
                  distanceKm:
                    type:
                      - number
                      - "null"
                required:
                  - subtotalMinor
                  - subtotalFormatted
                  - deliveryFeeMinor
                  - deliveryFeeFormatted
                  - platformFeeMinor
                  - platformFeeFormatted
                  - totalMinor
                  - totalFormatted
                additionalProperties: false
